# Runs the app + PostgreSQL on the Beelink Mini-PC.
#
# One compose file per environment via the project name and an env file:
#   dev :  docker compose -p appbaua-dev  --env-file deploy/dev.env  up -d --build
#   prod:  docker compose -p appbaua-prod --env-file deploy/prod.env up -d --build
#
# The env file (NOT committed) provides:
#   APP_PORT        host port the app listens on (e.g. 3001 dev, 3002 prod)
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   GITHUB_TOKEN    PAT for the private-repo reachability check
#   APP_ORIGIN      this deployment's own URL (req-023), e.g.
#                   https://dev.appbaua.com or https://app.appbaua.com —
#                   MUST differ between dev and prod (WebAuthn rpId binding)
#   CLOUDFLARE_TUNNEL_TOKEN
#                   this environment's cloudflared tunnel token (req-024),
#                   generated in the Cloudflare dashboard per tunnel — dev and
#                   prod each get their OWN tunnel and token
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#                   optional (req-033): bot key from @BotFather and the ONE chat
#                   appbaua reports to and accepts commands from
#   WATCHDOG_URL, WATCHDOG_TOKEN, WATCHDOG_INTERVAL_MINUTES
#                   optional (req-034): where the Ausfallwächter at the
#                   webhoster listens and the shared token — see
#                   watchdog/README.md
# DATABASE_URL is assembled from the POSTGRES_* vars below.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Discrete PG* fields instead of a URL: a password with URL-unsafe
      # chars (+ / =) would break connection-string parsing.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # PAT for the private-repo reachability check (req-001) and for the
      # "Auf appbaua umstellen" rollout (req-012), which clones a target repo and
      # pushes to its dev branch — so this token needs write access.
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Which repo the appbaua standard is read from (req-012). Optional; the
      # app falls back to github.com/kruianer/appbaua.
      APPBAUA_SOURCE_REPO: ${APPBAUA_SOURCE_REPO:-}
      # req-023: this deployment's own URL. Passkeys are bound to it (the
      # WebAuthn rpId is derived from it), so dev and prod MUST set different
      # values — https://dev.appbaua.com / https://app.appbaua.com — or a
      # passkey registered on one would silently not work on the other.
      APP_ORIGIN: ${APP_ORIGIN}
      NODE_ENV: production
      # System-Kacheln (req-009): wo die Host-Werte im Container liegen.
      HOST_PROC: /host/proc
      # Freier Speicherplatz: statfs auf dem EIGENEN Wurzel-Dateisystem des
      # Containers. Das ist die overlay-Schicht, und die liefert die Werte des
      # Docker-Datenträgers des Hosts — es muss dafür kein Host-Pfad gemountet
      # werden (bug-005).
      HOST_DISK: "/"
      # Zustandsübersicht (req-032): der Weg zur Docker-Engine führt über den
      # health-agent, NICHT über einen Socket in diesem Container (siehe dort).
      HEALTH_AGENT_URL: http://health-agent:3100
      # Telegram (req-033): Bot-Schlüssel und die EINE zugelassene Chat-Kennung.
      # Beide optional — fehlen sie, meldet appbaua nichts und nimmt keine
      # Befehle entgegen; die Überwachung selbst läuft unverändert weiter.
      # Ein Bot ist öffentlich ansprechbar, der ganze Schutz liegt darin, dass
      # nur diese Chat-Kennung akzeptiert wird. dev und prod sollten je einen
      # EIGENEN Bot bekommen, sonst kämen beide Umgebungen im selben Chat an.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Herzschlag zum Ausfallwächter beim Webhoster (req-034). Die Meldungen
      # oben nützen nichts, wenn DIESER Rechner ausfällt — dann sind sie mit
      # weg. Der Wächter läuft deshalb außerhalb und merkt, wenn der Herzschlag
      # ausbleibt. Alle drei optional; ohne Adresse und Kennung schlägt appbaua
      # keinen Herzschlag und läuft unverändert weiter. Einrichtung beim Hoster:
      # watchdog/README.md.
      WATCHDOG_URL: ${WATCHDOG_URL:-}
      WATCHDOG_TOKEN: ${WATCHDOG_TOKEN:-}
      WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-}
    volumes:
      # Read-only Blick auf das Host-/proc für die System-Kacheln (req-009) —
      # kein Docker-Socket. Dort stehen ALLE Prozesse des Rechners, also auch
      # die des Worker-Containers; daraus kommt die "CPU-Last des Workers".
      #
      # Das Host-Wurzelverzeichnis wird NICHT gemountet: es lag früher nur für
      # ein statfs im Lesebereich des einzigen internetzugewandten Prozesses —
      # samt ~/appbaua-env/*.env mit GITHUB_TOKEN und DB-Passwort (bug-005).
      - /proc:/host/proc:ro
    ports:
      - "${APP_PORT}:3000"

  # Simulated execution loop (req-004). Runs independently of the web app and
  # logs into the same Postgres.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # A real init as PID 1 (bug-018). Without it PID 1 is `npm run worker`, a
    # Node process that never reaps the children git/Claude Code leave behind:
    # every finished git call stays in the process table as a zombie. After a
    # few days that filled it with 14k entries and the container could not fork
    # at all any more — every step died with "cannot fork() for
    # git-remote-https: Resource temporarily unavailable". docker-init does the
    # one thing Node does not: wait() on whatever it inherits.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Token with write access to target repos (clone + push to dev).
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Claude Code authenticates via the user's Anthropic subscription (NOT an
      # API key -> no usage costs). Login lives in HOME=/claude-home, persisted
      # in the claude-home volume; do `claude login` once inside the container.
      HOME: /claude-home
      NODE_ENV: production
    volumes:
      - claude-home:/claude-home

  # Zustandsübersicht der überwachten Apps (req-032). Der einzige Dienst mit
  # Zugriff auf die Docker-Engine — und bewusst NICHT die App.
  #
  # Warum getrennt: bug-005 hat den Lesebereich des internetzugewandten
  # App-Containers klein gemacht, und der Docker-Socket wäre das genaue
  # Gegenteil davon (wer mit der Engine reden darf, ist auf dem Host praktisch
  # root). Der Agent nimmt dafür genau vier Aufrufe entgegen — auflisten, EINE
  # Umgebungsvariable lesen, einen erlaubten Befehl ausführen, einen Container
  # neu starten — und weist alles andere ab (agent/routes.ts, agent/index.ts).
  #
  # Er veröffentlicht keinen Port: erreichbar ist er nur über das
  # Compose-Netz, also aus der App heraus. Dieselbe Vertrauensgrenze wie beim
  # db-Dienst.
  #
  # Er läuft als root, weil der Socket auf dem Host root:docker gehört und die
  # GID der docker-Gruppe von Rechner zu Rechner verschieden ist.
  health-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HEALTH_AGENT_PORT: "3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # External access without an open router port (req-024): cloudflared holds
  # an outbound-only connection to Cloudflare's edge, which then routes the
  # environment's own domain (dev.appbaua.com / app.appbaua.com, set as the
  # tunnel's public hostname in the Cloudflare dashboard/config, NOT here) to
  # this container, which forwards to the app service over the compose
  # network. TLS terminates at the Cloudflare edge; the token that identifies
  # WHICH tunnel this is comes only from the env file, never the repo.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db-data:
  claude-home:
